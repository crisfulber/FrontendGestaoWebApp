<div class="card">
    <p-menubar [model]="items">
        <ng-template #start>
			<p-image src="../../../assets/images/logo-min.svg" width="40"></p-image>
        </ng-template>
        <ng-template #item let-item let-root="root">
            <a pRipple [routerLink]="item.routerLink" class="flex items-center p-menubar-item-link">
                <span>{{ item.label }}</span>
                <p-badge *ngIf="item.badge" [ngClass]="{ 'ml-auto': !root, 'ml-2': root }" [value]="item.badge" />
                <span *ngIf="item.shortcut" class="ml-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1">{{ item.shortcut }}</span>
                <i *ngIf="item.items" [ngClass]="['ml-auto pi', root ? 'pi-angle-down' : 'pi-angle-right']"></i>
            </a>
        </ng-template>
        <ng-template #end>
            <div class="flex items-center gap-2">
                <input type="text" pInputText placeholder="Procurar..." class="w-36" />
                <p-avatar image="../../../assets/images/avatar.png" shape="circle" />
            </div>
        </ng-template>
    </p-menubar>
</div>
