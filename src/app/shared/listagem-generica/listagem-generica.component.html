<div class="card">
  <p-toolbar styleClass="mb-2">
    <ng-template #start>
      <span class="text-xl text-primary font-semibold">Listagem de {{ titulo }}</span>
    </ng-template>
    <ng-template #end>
      <p-button 
        size="small" 
        label="Novo" 
        icon="pi pi-plus" 
        class="mr-2" 
        [routerLink]="['/' + endpoint + '/novo']" 
      />
      <p-button 
        size="small" 
        label="Exportar" 
        icon="pi pi-external-link"  
        variant="outlined"
        severity="info" 
      />
    </ng-template>
  </p-toolbar>
</div>

<p-table 
  #dt 
  [value]="itens" 
  [rows]="20" 
  [columns]="colunas" 
  [paginator]="true"
  [globalFilterFields]="['campo1', 'campo2']" 
  [rowHover]="true"
  [showCurrentPageReport]="true" 
  autoLayout="true"
  [exportHeader]="'Listagem de ' + titulo"
>
  <ng-template #header>
    <tr>
      <th style="width: auto">
        <p-tableHeaderCheckbox />
      </th>
      <th *ngFor="let coluna of colunas" [style.minWidth.px]="coluna.label === 'Valor' ? 100 : 150" 
          [ngClass]="{ 'text-right': coluna.label === 'Valor', 'text-left': coluna.label !== 'Valor' }">
        {{ coluna.label }}
      </th>
      <th *ngIf="mostrarAcoes">Ações</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-item>
    <tr>
      <td style="width: 3rem">
        <p-tableCheckbox [value]="item" />
      </td>
      <td *ngFor="let coluna of colunas" [ngClass]="{ 'text-right': coluna.label === 'Valor', 'text-left': coluna.label !== 'Valor' }">
        <span *ngIf="coluna.campo.includes('.')">
          {{ getNestedProperty(item, coluna.campo) }}
        </span>
        <span *ngIf="!coluna.campo.includes('.')">
          <ng-container *ngIf="coluna.tipo === 'select'; else defaultCell">
            <ng-container *ngFor="let option of options[coluna.campo]">
              <span *ngIf="option[coluna.valueField] === item[coluna.campo]">{{ option[coluna.labelField] }}</span>
            </ng-container>
          </ng-container>
          <ng-template #defaultCell>
            {{ item[coluna.campo] }}
          </ng-template>
        </span>
      </td>
      <td *ngIf="mostrarAcoes">
        <p-button variant="text" icon="pi pi-pen-to-square" class="mr-2" size="small" editarButton
          (click)="onEditarItem(item, $event)">
          <i class="bx bxs-edit-alt"></i>
        </p-button>
        <p-button variant="text" severity="danger" icon="pi pi-trash" size="small" outlined excluirButton
          (click)="onExcluirItem(item, $event)">
          <i class="bx bxs-trash-alt"></i>
        </p-button>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="999" class="text-center">Nenhum dado encontrado.</td>
    </tr>
  </ng-template>
</p-table>
