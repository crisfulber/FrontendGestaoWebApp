<app-listagem-generica
    [titulo]="'Endereços'"
    [colunas]="[
    { label: 'Rua', campo: 'rua', tipo: 'text', labelField: '', valueField: ''  },
    { label: 'N°', campo: 'numero', tipo: 'number', labelField: '', valueField: ''  },
    { label: 'Complemento', campo: 'complemento', tipo: 'text', labelField: '', valueField: ''  },
    { label: 'Bairro', campo: 'bairro', tipo: 'text', labelField: '', valueField: ''  },
    { label: 'CEP', campo: 'cep', tipo: 'text', labelField: '', valueField: ''  },
    { label: 'Município', campo: 'Municipio.nome', tipo: 'select', labelField: 'nome', valueField: 'idmunicipio'  }
   ]"
   [itens]="itens"
   [endpoint]="'endereco'"
   [idCampo]="idCampo"
   [campos]="campos"
   (itemSelecionadoChange)="onItemSelecionado($event)"
   (incluir)="onIncluirItem()"
   (editar)="onEditarItem($event)"
   (excluir)="onExcluirItem($event)"
></app-listagem-generica>
